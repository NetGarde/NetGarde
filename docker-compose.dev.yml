# Local test stack for macOS / laptop (no EC2 host paths).
# Usage: ./scripts/dev-up.sh
#        docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --build
#
# Does not include block-page, dns-sync, or WireGuard host agents.
# Frontend runs on the host: cd frontend && npm start
# TrustTwin ingest API: build from sibling ../TrustTwin repo (see TrustEdgeOrg/TrustTwin).

name: trustedge-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustedge-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trustedge
      POSTGRES_DB: trustedge
    ports:
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - trustedge-dev-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustedge"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trustedge-dev-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: trustedge-dev-api
    ports:
      - "${DEV_API_PORT:-8000}:8000"
    env_file:
      - .env.dev
    environment:
      # In-compose service DNS (overrides host-oriented values in .env.dev)
      DB_URL: postgresql+psycopg2://postgres:trustedge@postgres:5432/trustedge
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      LOG_TO_FILE: "0"
      LOG_JSON: "0"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_SERVICE: backend
      ENVIRONMENT: development
      USAGE_REDIS_ENABLED: "true"
      POLICY_PACK_SNAPSHOT_DIR: /var/lib/trustedge/policy-snapshots
      POLICY_PACK_FETCH_ENABLED: "${POLICY_PACK_FETCH_ENABLED:-false}"
      POLICY_PACK_REFRESH_ON_STARTUP: "${POLICY_PACK_REFRESH_ON_STARTUP:-false}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - trustedge-dev-policy-snapshots:/var/lib/trustedge/policy-snapshots
    command: >
      bash -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips='*'
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 50s
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: trustedge-dev-redpanda
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "${DEV_REDPANDA_PORT:-19092}:19092"
    volumes:
      - trustedge-dev-redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  detection-engine:
    build:
      context: ./detection-engine
      dockerfile: Dockerfile
    container_name: trustedge-dev-detection-engine
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: trusttwin.events
      KAFKA_GROUP_ID: detection-engine
      API_BASE_URL: http://backend:8000
      DNS_INGEST_TOKEN: ${DNS_INGEST_TOKEN:-}
      LOG_JSON: "1"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_SERVICE: detection-engine
    depends_on:
      redpanda:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  trusttwin-api:
    image: ${TRUSTTWIN_API_IMAGE:-trustedge-trusttwin-api:local}
    build:
      context: ${TRUSTTWIN_BUILD_CONTEXT:-../TrustTwin}
      dockerfile: Dockerfile
    container_name: trustedge-dev-trusttwin-api
    # Fresh named volumes are root-owned; run as root in local dev only.
    user: "0:0"
    ports:
      - "${DEV_TRUSTTWIN_API_PORT:-8080}:8080"
    environment:
      TRUSTTWIN_LISTEN: ":8080"
      TRUSTTWIN_DATA_DIR: /data
      TRUSTTWIN_ENROLL_TOKEN: ${TRUSTTWIN_ENROLL_TOKEN:-}
      TRUSTTWIN_PRODUCTION: "0"
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: trusttwin.events
    volumes:
      - trustedge-dev-trusttwin-data:/data
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  trustedge-dev-pg:
  trustedge-dev-policy-snapshots:
  trustedge-dev-trusttwin-data:
  trustedge-dev-redpanda-data:
